<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Login - SDIT Harapan Umat Karawang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/responsive.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e0f2fe 100%);
        }
        .bg-gradient-to-r { background-image: linear-gradient(to right, var(--brand-dark), var(--brand-color)); }
    </style>
    <link rel="stylesheet" href="css/theme.css">
<link rel="manifest" href="/manifest.webmanifest"><link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png"><meta name="theme-color" content="#216454"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="Gemar Mengaji"><link rel="stylesheet" href="/css/pwa.css">
    <link rel="stylesheet" href="css/layout-responsive.css?v=20260928-account-link-4">
    <link rel="stylesheet" href="css/visual-stage8.css?v=20260930-login2">
    <link rel="stylesheet" href="css/site-footer.css?v=20260930-footer2">
</head>
<body class="login-page min-h-screen flex items-center justify-center p-4">

    <div class="login-card bg-white w-full max-w-md rounded-2xl shadow-xl border border-blue-50/50 overflow-hidden transition-all duration-300 hover:shadow-2xl">
        <div class="bg-gradient-to-r from-blue-800 to-blue-600 px-6 py-8 text-center text-white relative">
            <div class="mx-auto w-16 h-16 bg-white rounded-full p-2 flex items-center justify-center shadow-md mb-3">
                <img src="assets/school-logo.png" alt="Logo SDIT" class="w-full h-full object-contain">
            </div>
            <h3 class="text-xl font-bold">Masuk ke Gemar Mengaji</h3>
            <p class="text-xs text-blue-100 mt-1">SDIT Harapan Umat Karawang</p>
        </div>

        <form id="loginForm" class="p-6 space-y-5">
            <div id="errorMessage" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-3 rounded text-sm">
                Username atau password salah!
            </div>

            <div>
                    <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Email Akun</label>
                <div class="relative rounded-lg shadow-sm">
                    <input type="text" id="username" name="username" 
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400" 
                        placeholder="Masukkan email akun" required>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                </div>
                <div class="relative rounded-lg shadow-sm">
                    <input type="password" id="password" name="password" 
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400" 
                        placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition-all duration-300 transform active:scale-[0.98] shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                <span>Masuk ke Panel</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>

            
            <div class="text-center pt-2">
                <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600 transition-colors inline-flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Kembali ke Halaman Utama
                </a>
            </div>
        </form>
        <footer class="site-footer" aria-label="Hak cipta dan pengelola situs">
    <p>&copy; 2026 SDIT Harapan Umat. All rights reserved.</p>
    <p>Web Design &amp; Management By <span class="site-footer-credit">Geys Amadda Dien.</span></p>
</footer>
    </div>

    <script>
        supabase.from('school_profile').select('*').eq('id', 1).maybeSingle().then(({ data }) => {
            if (!data) return;
            document.documentElement.style.setProperty('--brand-color', resolveThemeColor(data.theme_color));
            const logo = document.querySelector('img[alt="Logo SDIT"]');
            if (logo && data.logo_url) logo.src = String(data.logo_url).includes('FjF61ou.png') ? 'assets/school-logo.png' : data.logo_url;
            const title = document.querySelector('.bg-gradient-to-r h3');
            if (title && data.name) title.textContent = data.name;
        });

        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            const submitButton = this.querySelector('button[type="submit"]');
            const submitText = submitButton.querySelector('span');
            
            submitButton.disabled = true;
            submitText.textContent = 'Memeriksa akun...';
            try {
            const { error } = await supabase.auth.signInWithPassword({ email, password });

            if (!error) {
                const { data: session, error: userError } = await supabase.auth.getUser();
                if (userError || !session.user) throw new Error('Sesi belum tersedia. Silakan masuk kembali.');
                const { data: access, error: accessError } = await supabase.from('user_roles').select('role').eq('user_id', session.user.id).maybeSingle();
                if (accessError || !access || !['admin', 'koordinator', 'guru'].includes(access.role)) {
                    errorDiv.textContent = 'Akun belum memiliki akses. Hubungi koordinator untuk pemetaan akun.';
                    errorDiv.classList.remove('hidden');
                    submitButton.disabled = false;
                    submitText.textContent = 'Masuk ke Panel';
                    return;
                }
                errorDiv.classList.add('hidden');
                window.location.href = access.role === 'guru' ? 'guru.html' : 'admin.html';
            } else {
                errorDiv.textContent = 'Email atau password salah.';
                errorDiv.classList.remove('hidden');
                submitButton.disabled = false;
                submitText.textContent = 'Masuk ke Panel';
            }
            } catch (error) {
                errorDiv.textContent = error.message || 'Koneksi bermasalah. Silakan coba lagi.';
                errorDiv.classList.remove('hidden');
                submitButton.disabled = false;
                submitText.textContent = 'Masuk ke Panel';
            }
        });
    </script>


<script src="/js/pwa.js?v=20261001-refine1" defer></script>
</body>
</html>
