<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#216454">
<meta name="robots" content="noindex">
<title>Offline • Gemar Mengaji</title>
<link rel="stylesheet" href="/css/theme.css">
<link rel="stylesheet" href="/css/visual-stage8.css?v=20260929-loader35">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));background:radial-gradient(ellipse at 50% 0%,rgba(209,181,129,.12),transparent 42%),linear-gradient(145deg,#0d2e23,#174c3a 58%,#102e24);color:#f7f5ed;font-family:Poppins,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.offline-card{width:min(440px,100%);padding:clamp(24px,6vw,34px);text-align:center;border:1px solid rgba(209,181,129,.38);border-radius:22px;background:rgba(20,61,46,.94);box-shadow:0 22px 70px rgba(0,0,0,.24)}
.offline-card>img{width:76px;height:76px;object-fit:contain;margin:0 auto 17px;padding:8px;border:1px solid rgba(209,181,129,.55);border-radius:18px;background:#fdfcf7}
h1{font-size:clamp(20px,5vw,24px);line-height:1.35;letter-spacing:-.025em;margin:0 0 10px;color:#fffdf5}
p{margin:0 auto 21px;max-width:330px;color:#d0dfd2;line-height:1.75;font-size:13px}
.offline-state{display:inline-flex;align-items:center;gap:8px;margin-bottom:17px;padding:7px 11px;border:1px solid rgba(209,181,129,.35);border-radius:999px;background:rgba(209,181,129,.1);color:#f0d7a1;font-size:11px;font-weight:700}
.offline-state:before{content:"";width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:#d1b581}
button{min-height:45px;padding:0 20px;border:1px solid #d1b581;border-radius:11px;background:#f7f5ed;color:#174c3a;font:700 13px Poppins,system-ui,sans-serif;cursor:pointer;transition:background .18s ease,transform .18s ease}
button:hover{background:#e9e6d9}button:active{transform:scale(.98)}button:focus-visible{outline:2px solid #f0d7a1;outline-offset:3px}
small{display:block;margin-top:16px;color:#b9cdbd;font-size:11px;line-height:1.7}
.offline-card .site-footer{margin-top:24px;padding-top:16px;border-top:1px solid rgba(220,230,216,.16);color:#b9cdbd}
.offline-card .site-footer p{margin:0 auto 4px;color:inherit;font-size:10px;line-height:1.6}
.offline-card .site-footer .site-footer-credit{color:#f0d7a1}
@media(max-width:380px){.offline-card{padding:23px 18px;border-radius:18px}}
@media(prefers-reduced-motion:reduce){button{transition:none}}
</style>
    <link rel="stylesheet" href="css/site-footer.css?v=20260930-footer2">
</head>
<body class="offline-page">
<main class="offline-card">
<img src="/assets/school-logo.png" alt="Logo SDIT Harapan Umat">
<div class="offline-state" id="offlineState">Tidak ada koneksi</div>
<h1>Koneksi internet diperlukan</h1>
<p>Gemar Mengaji membutuhkan koneksi untuk memuat data terbaru dan menyimpan perubahan.</p>
<button id="retry" type="button">Coba lagi</button>
<small>Halaman akan mencoba tersambung kembali saat internet tersedia.</small>
<footer class="site-footer" aria-label="Hak cipta dan pengelola situs">
    <p>&copy; 2026 SDIT Harapan Umat. All rights reserved.</p>
    <p>Web Design &amp; Management By <span class="site-footer-credit">Geys Amadda Dien.</span></p>
</footer>
</main>
<script>
const retry=document.getElementById('retry'),state=document.getElementById('offlineState');
function sync(){if(navigator.onLine){state.textContent='Koneksi tersedia';location.reload()}else state.textContent='Tidak ada koneksi'}
retry.addEventListener('click',()=>location.reload());
window.addEventListener('online',sync);window.addEventListener('offline',sync);
</script>
</body>
</html>
