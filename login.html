<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Admin - SDIT Harapan Umat Karawang</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap');
        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #e0f2fe 100%);
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-2xl shadow-xl border border-blue-50/50 overflow-hidden transition-all duration-300 hover:shadow-2xl">
        <!-- Header Banner Login -->
        <div class="bg-gradient-to-r from-blue-800 to-blue-600 px-6 py-8 text-center text-white relative">
            <div class="mx-auto w-16 h-16 bg-white rounded-full p-2 flex items-center justify-center shadow-md mb-3">
                <img src="https://iili.io/FjF61ou.png" alt="Logo SDIT" class="w-full h-full object-contain">
            </div>
            <h3 class="text-xl font-bold">Panel Administrasi</h3>
            <p class="text-xs text-blue-100 mt-1">SDIT Harapan Umat Karawang</p>
        </div>

        <!-- Form Login -->
        <form id="loginForm" class="p-6 space-y-5">
            <div id="errorMessage" class="hidden bg-red-50 border-l-4 border-red-500 text-red-700 p-3 rounded text-sm">
                Username atau password salah!
            </div>

            <div>
                <label for="username" class="block text-sm font-medium text-gray-700 mb-1.5">Username</label>
                <div class="relative rounded-lg shadow-sm">
                    <input type="text" id="username" name="username" 
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400" 
                        placeholder="Masukkan username" required>
                </div>
            </div>

            <div>
                <div class="flex justify-between items-center mb-1.5">
                    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
                </div>
                <div class="relative rounded-lg shadow-sm">
                    <input type="password" id="password" name="password" 
                        class="w-full px-4 py-2.5 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-blue-500 transition-all placeholder-gray-400" 
                        placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 px-4 rounded-lg transition-all duration-300 transform active:scale-[0.98] shadow-md hover:shadow-lg flex items-center justify-center gap-2">
                <span>Masuk Ke Dashboard</span>
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3" />
                </svg>
            </button>

            <div class="text-center pt-2">
                <a href="index.html" class="text-sm text-gray-500 hover:text-blue-600 transition-colors inline-flex items-center gap-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" />
                    </svg>
                    Kembali ke Halaman Utama
                </a>
            </div>
        </form>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const errorDiv = document.getElementById('errorMessage');
            
            // Menggunakan kredensial yang sama dengan sistem lama Anda
            if (username === 'admin' && password === 'gurutahta') {
                errorDiv.classList.add('hidden');
                // Simpan status login sederhana di browser
                localStorage.setItem('isAdminLoggedIn', 'true');
                // Alihkan langsung secara fisik ke file halaman admin baru
                window.location.href = 'admin.html';
            } else {
                errorDiv.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
