<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="robots" content="noindex,nofollow">
    <meta name="referrer" content="same-origin">
    <meta name="theme-color" content="#216454">
    <title>Verifikasi Google · Gemar Mengaji</title>
    <link rel="stylesheet" href="css/theme.css">
    <style>
:root{color-scheme:dark}
*{box-sizing:border-box}
body{min-height:100vh;min-height:100dvh;margin:0;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:grid;place-items:center;font-family:Poppins,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 50% 0%,rgba(209,181,129,.13),transparent 42%),linear-gradient(145deg,#0d2e23,#174c3a 58%,#102e24);color:#f7f5ed}
.oauth-window{width:min(100%,420px);padding:30px 26px;text-align:center;border:1px solid rgba(209,181,129,.38);border-radius:22px;background:rgba(20,61,46,.94);box-shadow:0 22px 70px rgba(0,0,0,.24)}
.school-logo{display:grid;place-items:center;width:68px;height:68px;margin:0 auto 19px;border-radius:19px;background:#fdfcf7;border:1px solid rgba(209,181,129,.55);box-shadow:0 7px 20px rgba(0,0,0,.12)}
.school-logo img{width:50px;height:50px;object-fit:contain}
h1{margin:0;font-size:clamp(18px,4vw,20px);font-weight:700;line-height:1.4;letter-spacing:-.02em;color:#fffdf5}
#oauthStatus{margin:10px 0 0;color:#d0dfd2;font-size:13px;line-height:1.75;overflow-wrap:anywhere}
.oauth-loader{width:30px;height:30px;margin:22px auto 0;border-radius:50%;border:3px solid rgba(232,239,224,.2);border-top-color:#d1b581;animation:spin .8s linear infinite}
.oauth-loader[hidden]{display:none}
#oauthClose{margin-top:22px;min-height:44px;padding:10px 18px;border:1px solid #d1b581;border-radius:11px;background:#f7f5ed;color:#174c3a;font-size:13px;font-weight:700;cursor:pointer}
#oauthClose:hover{background:#e9e6d9}
#oauthClose:focus-visible{outline:2px solid #f0d7a1;outline-offset:3px}
#oauthClose[hidden]{display:none}
.oauth-note{margin-top:24px;padding-top:17px;border-top:1px solid rgba(220,230,216,.16);color:#b9cdbd;font-size:10px;line-height:1.7}
@keyframes spin{to{transform:rotate(360deg)}}
@media(max-width:380px){.oauth-window{padding:25px 18px;border-radius:18px}}
@media(prefers-reduced-motion:reduce){.oauth-loader{animation-duration:2s}}
</style>
</head>
<body>
    <main class="oauth-window" aria-live="polite" aria-busy="true">
        <div class="school-logo"><img src="assets/school-logo.png" alt="Logo SDIT Harapan Umat"></div>
        <h1 id="oauthTitle">Memverifikasi akun Google</h1>
        <p id="oauthStatus">Mohon tunggu, kami sedang memeriksa hasil autentikasi.</p>
        <div id="oauthLoader" class="oauth-loader" role="status" aria-label="Sedang memproses"></div>
        <button id="oauthClose" type="button" hidden>Tutup jendela</button>
        <div class="oauth-note">Absen Gemar Mengaji · SDIT Harapan Umat Karawang</div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/config.js"></script>
    <script src="js/google-oauth-popup-callback.js?v=20261029-popup2"></script>
</body>
</html>
